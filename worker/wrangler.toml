name = "wordbook-search"
main = "src/index.js"
compatibility_date = "2024-09-23"
workers_dev = true

# D1 binding. Create the database once with:
#   wrangler d1 create wordbook
# then paste the printed database_id below (it is not a secret — it only
# identifies the DB within your Cloudflare account).
[[d1_databases]]
binding = "DB"
database_name = "wordbook"
database_id = "47f7ec0c-56de-419a-b44b-4f97837bc55f"

# EU legislation in context (DGT-TM in English, Dutch, French, German, Italian
# and Spanish, ~7 GB of D1's 10 GB per database), kept apart from "wordbook"
# so a dictionary publish never re-uploads it. Built by `wordbook dgt-build` +
# `wordbook dgt-d1` in the private repo; see README.md. The Worker's
# /concordance query needs this database's layout (the n_<a>_<b> columns).
# Created 2026-11-05 with `wrangler d1 create eu-legislation --location weur`;
# it replaced "dgt-tm" (English–Dutch only, fd792a45-…).
[[d1_databases]]
binding = "DGT"
database_name = "eu-legislation"
database_id = "3447ab0a-662e-4d00-bef6-894c02eafe76"
